name: Refresh public activity
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-activity
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'boyan01/blog' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/banner-requirements.txt
      - name: Install banner renderer
        run: python -m pip install -r scripts/banner-requirements.txt
      - name: Verify data boundaries
        run: |
          node --test tests/activity.test.mjs
          python -m unittest discover -s tests -p '*_test.py'
      - name: Refresh the public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-activity.mjs
      - name: Render the profile banner
        run: python scripts/render-profile-banner.py
      - name: Save the snapshot and banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/activity.json assets/profile-banner.gif
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public activity and profile banner"
            git push origin HEAD:master
          fi
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pages/builds"
