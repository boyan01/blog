name: Refresh public activity
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-activity
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'boyan01/blog' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify data boundaries
        run: node --test tests/activity.test.mjs
      - name: Refresh the public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-activity.mjs
      - name: Save the snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/activity.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public activity snapshot"
            git push origin HEAD:master
          fi
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/pages/builds"
