<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}BIN</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:image" content="{{ '/assets/images/night-lake-storybook.png' | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.home %}<link rel="preload" as="image" href="{{ '/assets/images/night-lake-storybook.png' | relative_url }}">{% endif %}
</head>
<body class="{% if page.home %}home{% else %}interior{% endif %}">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="BIN 首页">BIN</a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}#footprints">足迹</a>
      <a href="{{ '/archive/' | relative_url }}" {% if page.archive %}aria-current="page"{% endif %}>旧文</a>
      <a href="https://github.com/boyan01" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  {{ content }}
  <footer class="site-footer wrap"><a href="{{ '/' | relative_url }}">BIN</a><a href="https://github.com/boyan01/blog" target="_blank" rel="noopener noreferrer">View source ↗</a></footer>
</body>
</html>
