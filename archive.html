---
layout: default
title: 文章
permalink: /archive/
archive: true
---
<main id="main" class="page wrap">
  <h1>文章</h1>
  <div class="post-list">{% for post in site.posts %}<a href="{{ post.url | relative_url }}"><span class="post-title">{{ post.title }}</span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time></a>{% endfor %}</div>
</main>
