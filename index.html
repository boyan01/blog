---
layout: default
home: true
---
<main id="main">
  <section class="scene" aria-label="最近 90 天的公开提交">
    <div class="ambient-stars" aria-hidden="true"></div>
    <div class="sky" id="sky" tabindex="-1">
      <div class="sky-art">
        <svg class="constellations" viewBox="0 0 640 350" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="star-layer"></div>
      </div>
    </div>
    <button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="true" aria-label="星星动画">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="icon-pause" d="M5 3.5v9M11 3.5v9"/><path class="icon-play" d="M5 3.2v9.6L12.5 8z"/></svg>
    </button>
    <div class="skyline" id="timeline" hidden>
      <div id="activity-bars" class="activity-bars" aria-hidden="true"></div>
      <input id="time-range" type="range" min="0" max="89" value="89" aria-label="选择日期">
      <div class="scrub-label"><output id="timeline-date" for="time-range"></output><button type="button" id="timeline-reset" hidden>回到今天</button></div>
    </div>
  </section>
  <div class="ground wrap">
    <section class="recent" id="footprints" aria-labelledby="footprints-title">
      <div class="section-head">
        <h2 id="footprints-title">最近</h2>
        <div class="repo-filters" role="group" aria-label="按仓库筛选"></div>
      </div>
      <div id="footprint-list" class="footprint-list"><noscript><p class="fallback-note"><a href="https://github.com/boyan01">在 GitHub 上查看</a></p></noscript></div>
      <button id="show-more" class="text-button" type="button" hidden>更早</button>
    </section>
    <section class="writing" aria-labelledby="writing-title">
      <h2 id="writing-title">文章</h2>
      <div class="post-list">{% for post in site.posts %}<a href="{{ post.url | relative_url }}"><span class="post-title">{{ post.title }}</span><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%Y.%m.%d' }}</time></a>{% endfor %}</div>
    </section>
  </div>
</main>
<dialog id="star-detail" aria-labelledby="detail-title"><button class="dialog-close" type="button" aria-label="关闭">×</button><p id="detail-date"></p><h2 id="detail-title"></h2><p class="detail-count"></p><ul class="detail-commits"></ul></dialog>
<script src="{{ '/assets/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
